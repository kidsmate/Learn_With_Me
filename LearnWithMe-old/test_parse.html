<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Parse</title></head>
<body>
<script src="js/data.js?v=20260912b"></script>
<script src="js/learning.js?v=20260912b"></script>
<script src="js/storage.js?v=20260912b"></script>
<script src="js/app.js?v=20260912b"></script>
<script>
function init() {}
window.addEventListener('DOMContentLoaded', () => {
  // ★ 关键测试场景：前面有"考试介绍/答题须知"说明文字，只有 4、5 是真正的题
  // 期望：只识别出 4、5 两道题，考试介绍不被当成题目
  const sampleText = `2023年某市中考生物试卷
注意事项：
1. 本试卷共8页，满分100分，考试时间60分钟。
2. 答题前，考生务必将自己的姓名、准考证号填写在答题卡上。
3. 请将答案填写在答题卡上，考试结束将试卷和答题卡一并交回。

一、选择题（每小题2分，共20分）
4. 下列属于植物细胞特有结构的是
A. 细胞壁 B. 细胞膜 C. 细胞质 D. 细胞核
5. 光合作用的主要场所是
A. 线粒体 B. 叶绿体 C. 液泡 D. 细胞核

二、填空题（每空1分，共10分）
6. 植物光合作用的原料是______和______。
7. 呼吸作用的产物是______和______。

参考答案
一、选择题
4. A  5. B
二、填空题
6. 二氧化碳、水  7. 二氧化碳和水`;

  const sections = parseExamSections(sampleText);
  const allQuestions = [];
  sections.forEach(sec => {
    const secText = sampleText.substring(sec.startIdx, sec.endIdx);
    const qs = parseQuestionsInSection(secText, sec.type);
    qs.forEach(q => {
      extractAnswers(sampleText, [q], sec.type);
      allQuestions.push({ type: sec.type, num: q.num, stem: q.stem.substring(0, 40), options: q.options, answer: q.answer });
    });
  });

  const out = {
    sectionsFound: sections.length,
    sections: sections.map(s => ({ type: s.type, label: s.label })),
    questionsFound: allQuestions.length,
    questions: allQuestions
  };
  console.log('PARSE RESULT', out);
  document.body.innerHTML = '<pre id="result" style="white-space:pre-wrap;font-size:13px">' +
    '大题数: ' + out.sectionsFound + '\n' +
    out.sections.map(s => '  - ' + s.type + ' | ' + s.label).join('\n') + '\n\n' +
    '小题数: ' + out.questionsFound + '（期望 4：选择4、5 + 填空6、7）\n' +
    JSON.stringify(out.questions, null, 2) +
    '</pre>';
});
</script>
</body>
</html>
