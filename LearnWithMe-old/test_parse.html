<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Parse</title></head>
<body>
<script src="js/data.js?v=20260912a"></script>
<script src="js/learning.js?v=20260912a"></script>
<script src="js/storage.js?v=20260912a"></script>
<script src="js/app.js?v=20260912a"></script>
<script>
// 覆盖 init，避免 app.js 绑定 DOM 事件
function init() {}
window.addEventListener('DOMContentLoaded', () => {
  // 综合样本：含无序号大题标题（"判断题..."）、选择题/填空题/判断题/简答题
  const sampleText = `2023年某市中考生物试卷
一、选择题（每小题2分，共20分）
1. 下列属于植物细胞特有结构的是
A. 细胞壁 B. 细胞膜 C. 细胞质 D. 细胞核
2. 光合作用的主要场所是
A. 线粒体 B. 叶绿体 C. 液泡 D. 细胞核

二、填空题（每空1分，共10分）
1. 植物光合作用的原料是______和______。
2. 呼吸作用的产物是______和______。

判断题（每小题1分，共10分）
1. 植物细胞具有细胞壁。
2. 动物细胞含有叶绿体。

三、简答题（共10分）
1. 简述光合作用与呼吸作用的区别。
2. 说明蒸腾作用对植物的意义。

参考答案
一、选择题
1. A  2. B
二、填空题
1. 二氧化碳、水  2. 二氧化碳和水
判断题
1. 正确  2. 错误
三、简答题
1. 光合作用制造有机物，呼吸作用分解有机物。
2. 蒸腾作用能促进水分和无盐的运输。`;

  const sections = parseExamSections(sampleText);
  const allQuestions = [];
  sections.forEach(sec => {
    const secText = sampleText.substring(sec.startIdx, sec.endIdx);
    const qs = parseQuestionsInSection(secText, sec.type);
    qs.forEach(q => {
      extractAnswers(sampleText, [q], sec.type);
      allQuestions.push({ type: sec.type, num: q.num, stem: q.stem.substring(0, 50), options: q.options, answer: q.answer });
    });
  });

  const out = {
    sectionsFound: sections.length,
    sections: sections.map(s => ({ type: s.type, label: s.label })),
    questionsFound: allQuestions.length,
    byType: sections.map(s => {
      const qs = allQuestions.filter(q => q.type === s.type);
      return { type: s.type, count: qs.length, sample: qs.slice(0, 2) };
    }),
    questions: allQuestions
  };
  console.log('PARSE RESULT', out);
  document.body.innerHTML = '<pre id="result" style="white-space:pre-wrap;font-size:13px">' +
    '大题数: ' + out.sectionsFound + '\n' +
    out.sections.map(s => '  - ' + s.type + ' | ' + s.label).join('\n') + '\n\n' +
    '小题数: ' + out.questionsFound + '\n' +
    JSON.stringify(out.questions, null, 2) +
    '</pre>';
});
</script>
</body>
</html>
