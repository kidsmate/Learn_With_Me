<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Parse</title></head>
<body>
<script src="js/data.js"></script>
<script src="js/learning.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js?v=fix2026c"></script>
<script>
// Override init to not set up event listeners
function init() {}
window.addEventListener('DOMContentLoaded', () => {
  const sampleText = `2023年某市中考语文试卷
一、选择题（本大题共10小题，每小题3分，共30分。其中第1-8题每题3分，第9-10题每题3分）
1. 下列词语中，加点字注音全部正确的一项是(    )
A. 憧憬(chōng) B. 恬静(tián) C. 怠慢(dài) D. 倔强(juè)
2. 下列各句中，没有语病的一句是(    )
A. 通过这次活动，使我们学到了很多
B. 他不仅学习成绩好，而且思想品德好
C. 我们要学习和发扬雷锋精神
D. 阅读优秀的文学作品，能够丰富人们的知识

二、填空题（每空1分，共10分）
1. 《春》的作者是__________，现代散文家、诗人。
2. 枯藤老树昏鸦，__________，古道西风瘦马。

三、阅读理解题（共30分）
阅读下面文段，回答问题。
1. 这段文字的说明对象是什么？

参考答案
一、选择题
1. B  2. D
二、填空题
1. 朱自清  2. 小桥流水人家
三、阅读理解
1. 说明对象是中国石拱桥。`;

  const sections = parseExamSections(sampleText);
  const allQuestions = [];
  sections.forEach(sec => {
    const secText = sampleText.substring(sec.startIdx, sec.endIdx);
    const qs = parseQuestionsInSection(secText, sec.type);
    qs.forEach(q => {
      extractAnswers(sampleText, [q], sec.type);
      allQuestions.push({ type: sec.type, num: q.num, stem: q.stem.substring(0, 60), options: q.options, answer: q.answer });
    });
  });

  // 输出解析结果
  document.body.innerHTML = '<pre id="result">' + JSON.stringify({
    sectionsFound: sections.length,
    sections: sections.map(s => ({ type: s.type, label: s.label })),
    questionsFound: allQuestions.length,
    questions: allQuestions
  }, null, 2) + '</pre>';
});
</script>
</body>
</html>
